name: fds-deploy

on:
  push:
    branches: [main]  # triggers when PR is merged to main

permissions:
  contents: write     # needed to push image tag update back to repo
  packages: write     # needed for GHCR

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: Chandrasekhar818
          password: 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

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/chandrasekhar818/fds-main:latest
            ghcr.io/chandrasekhar818/fds-main:${{ github.sha }}

      - name: Check Docker image size
        run: |
          IMAGE_NAME="ghcr.io/chandrasekhar818/fds-main:latest"
          docker pull $IMAGE_NAME
          SIZE=$(docker image inspect $IMAGE_NAME --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Docker image size: $SIZE_MB MB"

      - name: Update k8s deployment image tag
        run: |
          sed -i "s|image: ghcr.io/chandrasekhar818/fds-main:.*|image: ghcr.io/chandrasekhar818/fds-main:${{ github.sha }}|" k8s/deployment.yaml
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add k8s/deployment.yaml
          git commit -m "deploy: update image to ${{ github.sha }}"
          git push